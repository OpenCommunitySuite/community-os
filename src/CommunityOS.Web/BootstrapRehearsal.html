<!doctype html>
<html lang="uk">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тестове створення спільноти</title>
<style>
body { margin: 2rem auto; max-width: 56rem; padding: 0 1rem; font: 1rem system-ui; }
form, fieldset { margin-bottom: 1rem; }
label { display: block; margin: .6rem 0; }
input, button { font: inherit; padding: .3rem; }
output { display: block; white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
<h1>Тестове створення спільноти</h1>
<p>Локальна репетиція з тестовими обліковими записами.</p>
<form id="login">
  <label>Тестовий код входу <input id="code" type="password" required autocomplete="off"></label>
  <button>Увійти</button>
</form>
<button id="logout" type="button">Вийти</button>
<form id="create">
  <fieldset>
    <legend>Створити спільноту й призначити першого адміністратора</legend>
    <label>Назва <input id="displayName" required maxlength="150"></label>
    <label>Ідентифікатор адміністратора <input id="administratorAccountId" required></label>
    <label>Ідентифікатор запиту <input id="requestId" required></label>
    <button>Створити й призначити</button>
    <button id="new-request" type="button">Новий ідентифікатор запиту</button>
  </fieldset>
</form>
<fieldset>
  <legend>Перевірка призначення та журналу</legend>
  <label>Спільнота <input id="community"></label>
  <label>Операція <input id="operation"></label>
  <button id="assignment" type="button">Перевірити мій доступ</button>
  <button id="events" type="button">Показати журнал</button>
  <button id="revoke" type="button">Відкликати призначення</button>
</fieldset>
<output id="result" aria-live="polite"></output>
<script>
const byId = id => document.getElementById(id);
const root = '/platform/rehearsal';
const value = id => byId(id).value.trim();
byId('requestId').value = crypto.randomUUID();
byId('new-request').onclick = () => byId('requestId').value = crypto.randomUUID();
async function call(path, method = 'GET', body) {
  try {
    const response = await fetch(root + path, {
      method, headers: { 'X-Bootstrap-Rehearsal': '1', 'Content-Type': 'application/json' },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    const text = await response.text();
    let data = null;
    if (text) {
      try { data = JSON.parse(text); } catch { data = text; }
    }
    byId('result').textContent = response.status + (data === null ? '' : '\n' + JSON.stringify(data, null, 2));
    return response.ok ? data : null;
  } catch {
    byId('result').textContent = 'Не вдалося виконати запит.';
    return null;
  }
}
byId('login').onsubmit = async event => {
  event.preventDefault();
  const code = value('code');
  byId('code').value = '';
  await call('/login', 'POST', { code });
};
byId('logout').onclick = () => call('/logout', 'POST');
byId('create').onsubmit = async event => {
  event.preventDefault();
  const data = await call('/communities', 'POST', {
    displayName: value('displayName'), administratorAccountId: value('administratorAccountId'), requestId: value('requestId'),
  });
  if (data?.reservation) {
    byId('community').value = data.reservation.communityId;
    byId('operation').value = data.reservation.operationId;
  }
};
const communityPath = () => '/communities/' + encodeURIComponent(value('community'));
byId('assignment').onclick = () => call(communityPath() + '/assignment');
byId('events').onclick = () => call(communityPath() + '/events');
byId('revoke').onclick = () => call(communityPath() + '/operations/' + encodeURIComponent(value('operation')) + '/revoke', 'POST');
</script>
</html>
